[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "openclassrooms_projet5"
version = "0.1.0"
description = "API de deploiement du modele attrition Projet 4 pour Futurisys."
authors = [
  { name = "hgbe" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "ipython",
    "joblib>=1.5.3",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "psycopg[binary]>=3.2.12",
    "pytest",
    "pytest-cov",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "sqlalchemy>=2.0.44",
    "tqdm",
    "typer",
    "uvicorn>=0.46.0",
    "xgboost>=3.2.0",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["openclassrooms_projet5"]
include = ["pyproject.toml", "openclassrooms_projet5/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["openclassrooms_projet5"]
force-sort-within-sections = true
