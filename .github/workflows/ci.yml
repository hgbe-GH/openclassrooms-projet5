name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 10
    env:
      POSTGRES_DB: attrition_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/attrition_api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: attrition_api
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attrition_api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore local model artifact
        run: |
          mkdir -p models
          if [ -n "${{ secrets.MODEL_ARTIFACT_PASSPHRASE }}" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 \
              -in models/attrition_xgboost_pipeline.joblib.enc \
              -out models/attrition_xgboost_pipeline.joblib \
              -pass pass:"${{ secrets.MODEL_ARTIFACT_PASSPHRASE }}"
          else
            echo "MODEL_ARTIFACT_PASSPHRASE secret is required for full prediction tests."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create database and run migrations
        run: uv run python scripts/create_db.py --skip-create-db

      - name: Run tests
        run: uv run pytest --cov=openclassrooms_projet5 --cov-report=term-missing --cov-report=xml

      - name: Run lint
        run: uv run ruff check .

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy-huggingface:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    environment: production
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare model artifact
        run: |
          mkdir -p models
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in models/attrition_xgboost_pipeline.joblib.enc \
            -out models/attrition_xgboost_pipeline.joblib \
            -pass pass:"${{ secrets.MODEL_ARTIFACT_PASSPHRASE }}"

      - name: Push repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret and HF_SPACE variable are required for deployment."
            exit 1
          fi
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git remote add huggingface "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push --force huggingface HEAD:main
